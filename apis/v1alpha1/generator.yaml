ignore:
  field_paths:
    - "RequestCertificateInput.IdempotencyToken"
    - "RequestCertificateInput.ValidationMethod"
    - "CreateAcmeEndpointInput.IdempotencyToken"
    - "CreateAcmeDomainValidationInput.IdempotencyToken"
    - "CreateAcmeExternalAccountBindingInput.IdempotencyToken"
operations:
  RequestCertificate:
    resource_name: Certificate
    operation_type: CREATE
  # NOTE(jaypipes): There is a GetCertificate API call, but that returns the
  # actual cert bytes, not the attributes of the certificate request
  DescribeCertificate:
    resource_name: Certificate
    operation_type: READ_ONE
  UpdateCertificateOptions:
    resource_name: Certificate
    operation_type: UPDATE
  CreateAcmeEndpoint:
    resource_name: AcmeEndpoint
    operation_type: CREATE
  DescribeAcmeEndpoint:
    resource_name: AcmeEndpoint
    operation_type: READ_ONE
  UpdateAcmeEndpoint:
    resource_name: AcmeEndpoint
    operation_type: UPDATE
  DeleteAcmeEndpoint:
    resource_name: AcmeEndpoint
    operation_type: DELETE
  # ACME External Account Binding operations
  CreateAcmeDomainValidation:
    resource_name: AcmeDomainValidation
    operation_type: CREATE
  DescribeAcmeDomainValidation:
    resource_name: AcmeDomainValidation
    operation_type: READ_ONE
  UpdateAcmeDomainValidation:
    resource_name: AcmeDomainValidation
    operation_type: UPDATE
  DeleteAcmeDomainValidation:
    resource_name: AcmeDomainValidation
    operation_type: DELETE
  CreateAcmeExternalAccountBinding:
    resource_name: AcmeExternalAccountBinding
    operation_type: CREATE
  DescribeAcmeExternalAccountBinding:
    resource_name: AcmeExternalAccountBinding
    operation_type: READ_ONE
  DeleteAcmeExternalAccountBinding:
    resource_name: AcmeExternalAccountBinding
    operation_type: DELETE
resources:
  Certificate:
    hooks:
      delta_pre_compare:
        template_path: hooks/certificate/delta_pre_compare.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/certificate/sdk_update_pre_build_request.go.tpl
      sdk_update_post_set_output:
        template_path: hooks/certificate/sdk_update_post_set_output.go.tpl
      sdk_create_pre_build_request:
        template_path: hooks/certificate/sdk_create_pre_build_request.go.tpl
      sdk_create_post_build_request:
        template_path: hooks/certificate/sdk_create_post_build_request.go.tpl
      sdk_read_one_pre_set_output:
        template_path: hooks/certificate/sdk_read_one_pre_set_output.go.tpl
      sdk_file_end:
        template_path: hooks/certificate/sdk_file_end.go.tpl
      late_initialize_post_read_one:
        template_path: hooks/certificate/late_initialize_post_read_one.go.tpl
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
      terminal_codes:
        - InvalidParameterException
        - InvalidDomainValidationOptionsException
        - InvalidTagException
        - TagPolicyException
        - TooManyTagsException
        - InvalidArnException
    reconcile:
      requeue_on_success_seconds: 60
    fields:
      ExportTo:
        type: "bytes"
        is_immutable: true
        is_secret: true
        compare:
          is_ignored: true
      DomainName:
        is_primary_key: false
        is_required: false
        is_immutable: true
      Certificate:
        type: "bytes"
        is_secret: true
        is_immutable: true
        compare:
          is_ignored: true
      PrivateKey:
        type: "bytes"
        is_secret: true
        is_immutable: true
        compare:
          is_ignored: true
      CertificateArn:
        type: string
        is_immutable: true
      CertificateChain:
        type: "bytes"
        is_immutable: true
        is_secret: true
        compare:
          is_ignored: true
      CertificateAuthorityARN:
        references:
          service_name: acmpca
          resource: CertificateAuthority
          path: Status.ACKResourceMetadata.ARN
        is_immutable: true
      KeyAlgorithm:
        late_initialize: {}
        is_immutable: true
        compare:
          is_ignored: true
      ManagedBy:
        is_immutable: true
        compare:
          is_ignored: true
      Options:
        late_initialize: {}
      Options.Export:
        late_initialize: {}
      # NOTE(jaypipes): The Create operation (RequestCertificate) has a
      # response with only a single field (certificateArn). All of the status
      # fields for the certificate are in the ReadOne operation
      # (DescribeCertificate) response, so we need to tell the code-generator
      # about all of those fields manually here...
      CreatedAt:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.CreatedAt
      DomainValidations:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.DomainValidationOptions
      DomainValidationOptions:
        is_immutable: true
        compare:
          is_ignored: true
      ExtendedKeyUsages:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.ExtendedKeyUsages
      FailureReason:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.FailureReason
      ImportedAt:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.ImportedAt
      InUseBy:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.InUseBy
      IssuedAt:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.IssuedAt
      Issuer:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.Issuer
      KeyUsages:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.KeyUsages
      NotAfter:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.NotAfter
      NotBefore:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.NotBefore
      RenewalEligibility:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.RenewalEligibility
      RenewalSummary:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.RenewalSummary
      RevocationReason:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.RevocationReason
      RevokedAt:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.RevokedAt
      Serial:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.Serial
      SignatureAlgorithm:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.SignatureAlgorithm
      Status:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.Status
      Subject:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.Subject
      Type:
        is_read_only: true
        from:
          operation: DescribeCertificate
          path: Certificate.Type
      SubjectAlternativeNames:
        late_initialize: {}
        is_immutable: true
        compare:
          is_ignored: true

  AcmeEndpoint:
    hooks:
      delta_pre_compare:
        template_path: hooks/acme_endpoint/delta_pre_compare.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/acme_endpoint/sdk_update_pre_build_request.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/acme_endpoint/sdk_read_one_post_set_output.go.tpl
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
      terminal_codes:
        - InvalidParameterException
        - InvalidArnException
        - InvalidTagException
        - TagPolicyException
        - TooManyTagsException
        - ValidationException
    reconcile:
      requeue_on_success_seconds: 30
    synced:
      when:
        - path: Status.Status
          in:
            - ACTIVE
    fields:
      Contact:
        late_initialize: {}
      CertificateTags:
        is_immutable: true

      # The Create response only returns the ARN. All other fields come from
      # DescribeAcmeEndpoint which returns an AcmeEndpoint struct.
      AcmeEndpointArn:
        is_read_only: true
        from:
          operation: DescribeAcmeEndpoint
          path: AcmeEndpoint.AcmeEndpointArn
      EndpointUrl:
        is_read_only: true
        from:
          operation: DescribeAcmeEndpoint
          path: AcmeEndpoint.EndpointUrl
      Status:
        is_read_only: true
        from:
          operation: DescribeAcmeEndpoint
          path: AcmeEndpoint.Status
      FailureReason:
        is_read_only: true
        from:
          operation: DescribeAcmeEndpoint
          path: AcmeEndpoint.FailureReason
      CreatedAt:
        is_read_only: true
        from:
          operation: DescribeAcmeEndpoint
          path: AcmeEndpoint.CreatedAt
      UpdatedAt:
        is_read_only: true
        from:
          operation: DescribeAcmeEndpoint
          path: AcmeEndpoint.UpdatedAt

  AcmeDomainValidation:
    hooks:
      sdk_update_pre_build_request:
        template_path: hooks/acme_domain_validation/sdk_update_pre_build_request.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/acme_domain_validation/sdk_read_one_post_set_output.go.tpl
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
      terminal_codes:
        - InvalidParameterException
        - InvalidArnException
        - InvalidTagException
        - TagPolicyException
        - TooManyTagsException
        - ValidationException
    # Treat a domain validation as a point-in-time health check, not a resource
    # with a terminal state:
    #   VALID    -> Synced=True, re-checked at the controller resync period
    #               (10h by default, tunable per-kind with
    #               --reconcile-resource-resync-seconds). A healthy domain going
    #               INVALID later is picked up then; that lag is acceptable.
    #   INVALID  -> Synced=False, so the ACK runtime re-checks every 30s
    #               (requeue.DefaultRequeueAfterDuration) and a customer fixing
    #               their DNS configuration is reflected quickly.
    # This mirrors how the EKS controller handles an Addon's DEGRADED state:
    # only ACTIVE counts as synced, and DEGRADED is deliberately NOT terminal.
    # NOTE: requeue_on_success_seconds is intentionally NOT set — it takes
    # precedence over the resync period for the Synced=True path
    # (runtime getResyncPeriod), which would pin VALID to the same fast poll and
    # make the asymmetry a no-op.
    synced:
      when:
        - path: Status.Status
          in:
            - VALID
    tags:
      ignore: false
    fields:
      PrevalidationOptions.DNSPrevalidation.HostedZoneID:
        references:
          resource: HostedZone
          service_name: route53
          path: Status.ID
      AcmeEndpointArn:
        is_immutable: true
        references:
          resource: AcmeEndpoint
          path: Status.ACKResourceMetadata.ARN
      DomainName:
        is_immutable: true
      PrevalidationOptions.DNSPrevalidation.DomainScope.ExactDomain:
        late_initialize: {}
      PrevalidationOptions.DNSPrevalidation.DomainScope.Subdomains:
        late_initialize: {}
      PrevalidationOptions.DNSPrevalidation.DomainScope.Wildcards:
        late_initialize: {}
      # Status fields from DescribeAcmeDomainValidation
      Status:
        is_read_only: true
        from:
          operation: DescribeAcmeDomainValidation
          path: AcmeDomainValidation.Status
      PrevalidationType:
        is_read_only: true
        from:
          operation: DescribeAcmeDomainValidation
          path: AcmeDomainValidation.PrevalidationType
      PrevalidationDetails:
        is_read_only: true
        from:
          operation: DescribeAcmeDomainValidation
          path: AcmeDomainValidation.PrevalidationDetails
      FailureDetails:
        is_read_only: true
        from:
          operation: DescribeAcmeDomainValidation
          path: AcmeDomainValidation.FailureDetails
      CreatedAt:
        is_read_only: true
        from:
          operation: DescribeAcmeDomainValidation
          path: AcmeDomainValidation.CreatedAt
      UpdatedAt:
        is_read_only: true
        from:
          operation: DescribeAcmeDomainValidation
          path: AcmeDomainValidation.UpdatedAt
  AcmeExternalAccountBinding:
    tags:
      ignore: false
    hooks:
      sdk_create_post_set_output:
        template_path: hooks/acme_external_account_binding/sdk_create_post_set_output.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/acme_external_account_binding/sdk_read_one_post_set_output.go.tpl
    # The external account binding has no service-side update operation, so the
    # generated sdkUpdate is a custom method that reconciles only the tag set
    # via the standardized TagResource/UntagResource API.
    update_operation:
      custom_method_name: customUpdateAcmeExternalAccountBinding
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
      terminal_codes:
        - InvalidParameterException
        - InvalidArnException
        - InvalidTagException
        - TagPolicyException
        - TooManyTagsException
        - ValidationException
    # A short requeue keeps the server-side status fields (lastUsedAt, revokedAt,
    # expiresAt) close to reality, since the service changes them without any spec edit
    # to trigger a reconcile. Same interval as Certificate above; AcmeEndpoint uses 30s.
    reconcile:
      requeue_on_success_seconds: 60
    fields:
      AcmeEndpointArn:
        is_immutable: true
        references:
          resource: AcmeEndpoint
          path: Status.ACKResourceMetadata.ARN
      # Reviewer suggestion: a cross-resource reference so an operator can point at an ACK
      # IAM Role object instead of copying its ARN in by hand.
      RoleArn:
        is_immutable: true
        references:
          resource: Role
          service_name: iam
          path: Status.ACKResourceMetadata.ARN
      Expiration:
        is_immutable: true
      # `type` is a Go keyword, so the names package suffixes the generated field — and the
      # suffix leaks into the JSON tag, which is why released CRDs in this controller carry
      # `type_`. code-generator added go_tag precisely so NEW fields need not inherit that;
      # its own comment calls the underscore "not ideal because it weirdens the experience for
      # the users of the generated CRDs", and declined to fix the names package only because
      # doing so would rewrite already-published CRDs. Expiration is used by no other resource
      # here and this one is unreleased, so this is the last moment the name can be chosen.
      # ec2-controller and lambda-controller do the same for their nested Type fields.
      Expiration.Type:
        go_tag: json:"type,omitempty"
      # Secret where EAB credentials (keyId, macKey) are written. Uses the same
      # SecretKeyReference pattern as Certificate.exportTo so users can target a
      # Secret in any namespace. The Secret must already exist — the controller
      # populates it (WriteToSecret patches, it does not create).
      CredentialsOutput:
        type: "bytes"
        is_secret: true
        is_immutable: true
        compare:
          is_ignored: true
      # Status fields from DescribeAcmeExternalAccountBinding
      # KeyID is the EAB key identifier (not sensitive; pairs with the macKey
      # stored in the Secret). It is populated by the create hook from the
      # GetAcmeExternalAccountBindingCredentials response so ACME clients can
      # read it from status when registering an account.
      KeyID:
        is_read_only: true
        type: string
      CreatedAt:
        is_read_only: true
        from:
          operation: DescribeAcmeExternalAccountBinding
          path: ExternalAccountBinding.CreatedAt
      ExpiresAt:
        is_read_only: true
        from:
          operation: DescribeAcmeExternalAccountBinding
          path: ExternalAccountBinding.ExpiresAt
      LastUsedAt:
        is_read_only: true
        from:
          operation: DescribeAcmeExternalAccountBinding
          path: ExternalAccountBinding.LastUsedAt
      RevokedAt:
        is_read_only: true
        from:
          operation: DescribeAcmeExternalAccountBinding
          path: ExternalAccountBinding.RevokedAt
      UpdatedAt:
        is_read_only: true
        from:
          operation: DescribeAcmeExternalAccountBinding
          path: ExternalAccountBinding.UpdatedAt
