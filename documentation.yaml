resources:
  Certificate:
    fields:
      Certificate:
        prepend: |
          Opaque secret import field. Reference to a Kubernetes Secret key containing the leaf certificate PEM to
          import into ACM. Requires privateKey. Mutually exclusive with importFrom and certificate request
          fields. If the PEM contains multiple certificate blocks, the controller splits leaf and
          intermediate certificates automatically. Immutable once set.
      PrivateKey:
        prepend: |
          Opaque secret import field. Reference to a Kubernetes Secret key containing the private key PEM that
          matches certificate. Required when certificate is set. Mutually exclusive with importFrom and
          certificate request fields. Immutable once set.
      CertificateChain:
        prepend: |
          Opaque secret import field. Optional reference to a Kubernetes Secret key containing intermediate
          certificate PEMs. Use when the chain is stored separately from certificate. Mutually exclusive
          with importFrom and certificate request fields. Immutable once set.
      CertificateARN:
        prepend: |
          The Amazon Resource Name (ARN) of an imported certificate to replace. Valid with opaque secret
          import (certificate/privateKey) or importFrom. Immutable once set.
      ImportFrom:
        prepend: |
          Reference to an existing Kubernetes TLS Secret to import into ACM. The certificate PEM is read from
          tls.crt and the private key is read from tls.key in the Secret. If tls.crt contains multiple PEM
          blocks (leaf certificate followed by intermediate certificates), they are automatically split for
          ACM import. Mutually exclusive with opaque secret import fields (certificate, privateKey,
          certificateChain) and certificate request fields. May be updated after creation. certificateARN
          may be set to replace an existing imported certificate.

  AcmeEndpoint:
    fields:
      AuthorizationBehavior:
        prepend: |
          The authorization behavior for the ACME endpoint. Valid values: PRE_APPROVED.
      CertificateAuthority:
        prepend: |
          The certificate authority to use for issuing certificates through this endpoint.
          Currently only PublicCertificateAuthority (Amazon Trust Services) is supported.
          Optionally specify AllowedKeyAlgorithms to restrict key algorithms for issued certificates.
      Contact:
        prepend: |
          Whether ACME clients must provide contact information during account registration.
          Valid values: REQUIRED, NOT_REQUIRED.
  AcmeDomainValidation:
    fields:
      AcmeEndpointArn:
        prepend: |
          The ARN of the ACME endpoint to validate the domain for.
      DomainName:
        prepend: |
          The domain name to validate. Use DomainScope within PrevalidationOptions
          to control whether validation applies to the exact domain, subdomains,
          and/or wildcards.
      PrevalidationOptions:
        prepend: |
          Configuration for domain prevalidation. Specify DnsPrevalidation with a
          Route 53 HostedZoneId and optional DomainScope (ExactDomain, Subdomains,
          Wildcards — each ENABLED or DISABLED).
  AcmeExternalAccountBinding:
    fields:
      AcmeEndpointARN:
        prepend: |
          The ARN of the ACME endpoint to associate this external account binding with.
      RoleARN:
        prepend: |
          The ARN of the IAM role associated with the external account binding.
          The role's trust policy must grant acm-acme.amazonaws.com access to
          sts:AssumeRole, sts:SetSourceIdentity, and sts:TagSession.
      CredentialsOutput:
        prepend: |
          The Kubernetes Secret where EAB credentials are written. Specify the namespace,
          name, and key. The sensitive macKey is written under the given key; the keyId is
          written under a fixed keyId key, unless key is itself keyId, in which case the
          macKey wins and the identifier is available in status.keyID. If namespace is
          omitted, the resource's namespace is used. The Secret must already exist; the
          controller populates it.
      KeyID:
        prepend: |
          The external account binding key identifier. This value is not sensitive and
          pairs with the macKey stored in the credentials Secret. It is surfaced in status
          so ACME clients can reference it directly when registering an account.
